size="11" lengthAdjust="spacing" textLength="135.7329" x="331.31" y="256.4702">evidence &#8594; MolGen variant</text></g><g class="entity" data-entity="GMN7" data-source-line="33" data-uid="ent0008" id="entity_GMN7"><path d="M6,334 L6,396 A4,4 0 0 0 10,400 L240.4531,400 A4,4 0 0 0 244.4531,396 L244.4531,340 L234.4531,330 L129.23,330 L125.23,269.47 L121.23,330 L10,330 A4,4 0 0 0 6,334" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M234.4531,330 L234.4531,338 A2,2 0 0 0 236.4531,340 L244.4531,340 L234.4531,330" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="133.3711" x="12" y="344.2402">Both exist side by side.</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="217.4531" x="12" y="356.2402">The genetic diagnosis does NOT replace</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="191.4141" x="12" y="368.2402">the clinical one &#8212; it complements it.</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="161.4258" x="12" y="380.2402">A patient ends up carrying two</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="110.0566" x="12" y="392.2402">Condition resources.</text></g><!--link V to K--><g class="link" data-entity-1="V" data-entity-2="K" data-source-line="29" data-uid="lnk5" id="link_V_K"><path d="M125.23,107.14 C125.23,131.95 125.23,160.53 125.23,186.69" fill="none" id="V-to-K" style="stroke:#555555;stroke-width:1;"/><polygon fill="#555555" points="125.23,192.69,129.23,183.69,125.23,187.69,121.23,183.69,125.23,192.69" style="stroke:#555555;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="58.043" x="126.23" y="147.2402">phenotypic</text><text fill="#000000" font-fam