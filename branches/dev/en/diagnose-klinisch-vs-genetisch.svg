</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="37.3301" x="175.9791" y="302.2402">(HPO).</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="116.0566" x="29.94" y="314.2402">Nachweis ist optional.</text></g><g class="entity" data-entity="GMN8" data-source-line="70" data-uid="ent0009" id="entity_GMN8"><path d="M324.92,282 L324.92,328 A0,0 0 0 0 324.92,328 L537.3165,328 A0,0 0 0 0 537.3165,328 L537.3165,292 L527.3165,282 L435.12,282 L431.12,222.26 L427.12,282 L324.92,282 A0,0 0 0 0 324.92,282" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M527.3165,282 L527.3165,292 L537.3165,292 L527.3165,282" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="78.0293" x="330.92" y="296.2402">Belegt sich mit</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="98.0273" x="412.2833" y="296.2402">Molekulargenetik</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="3.334" x="510.3106" y="296.2402">.</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="67.3535" x="330.92" y="308.2402">Nachweis ist</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="36.668" x="401.6075" y="308.2402">Pflicht</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="80.707" x="441.6095" y="308.2402">(evidence 1..*),</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="172.7637" x="330.92" y="320.2402">empfohlen die MolGen-Variante.</text></g><g class="entity" data-entity="N" data-source-line="76" data-uid="ent0011" id="entity_N"><path d="M617.55,103 L617.55,161 L916.682