# IG build + GitHub Pages branch preview.
#
# Thin caller of the reusable build in mii-kds-module-template. The steps,
# toolchain pins and preview layout (gh-pages/branches/<branch>/) live there;
# this file only says when to build. Update by moving the SHA pin to a newer
# release of the template.
#
# Triggers:  push to every branch except main / gh-pages / fsh-generated, plus
#            manual workflow_dispatch. main and tags are reserved for formal
#            publication (go-publish.yml) and are not previewed here.
# Toggles:   vars.ENABLE_PREVIEW, ENABLE_QA_SUMMARY, PAGES_ACTIONS_ENABLED and the
#            other variables the reusable workflow documents are read from
#            this repository.
name: IG build and preview

on:
  push:
    branches:
      - "**"
      - "!main"
      - "!gh-pages"
      - "!fsh-generated"
  workflow_dispatch:

permissions:
  contents: write # push previews to the gh-pages branch
  pages: write # PAGES_ACTIONS_ENABLED deploy path
  id-token: write # deploy-pages OIDC
  pull-requests: write # upsert the preview-URL PR comment
  issues: write # PR comments go through the issues API

concurrency:
  # Serialize every writer of the gh-pages branch (previews, cleanup, and the
  # formal go-publish share this group) so they never race. Queue, never cancel.
  group: gh-pages-writes
  cancel-in-progress: false

jobs:
  build:
    uses: medizininformatik-initiative/mii-kds-module-template/.github/workflows/ci_build.yml@4afed9a126d31cb7ff0a059c3a0dd74157b29e90 # mii-kds-module-template feat/reusable-build-workflow (Phase-1 test)
    secrets: inherit
