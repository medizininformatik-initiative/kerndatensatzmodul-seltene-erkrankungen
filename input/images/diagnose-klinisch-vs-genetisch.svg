e</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="37.3301" x="172.6428" y="302.2402">(HPO).</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="110.0684" x="33.26" y="314.2402">Evidence is optional.</text></g><g class="entity" data-entity="GMN8" data-source-line="60" data-uid="ent0009" id="entity_GMN8"><path d="M315.58,282 L315.58,328 A0,0 0 0 0 315.58,328 L546.6679,328 A0,0 0 0 0 546.6679,328 L546.6679,292 L536.6679,282 L435.12,282 L431.12,222.26 L427.12,282 L315.58,282 A0,0 0 0 0 315.58,282" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M536.6679,282 L536.6679,292 L546.6679,292 L536.6679,282" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="72.0469" x="321.58" y="296.2402">Evidenced by</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="108.709" x="396.9609" y="296.2402">molecular genetics</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="3.334" x="505.6698" y="296.2402">.</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="61.3652" x="321.58" y="308.2402">Evidence is</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="61.3477" x="386.2792" y="308.2402">mandatory</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="80.707" x="450.9609" y="308.2402">(evidence 1..*),</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="196.7578" x="321.58" y="320.2402">the MolGen variant is recommended.</text></g><g class="entity" data-entity="N" data-source-line="66" data-uid="ent0011" id="entity_N"><path d="M616.88,103 L616.88,161 L91