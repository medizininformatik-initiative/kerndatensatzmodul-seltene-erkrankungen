# This is the minimal rule series for MII Seltene Erkrankungen Module
# removed 'action: unique' due to multiple versions of OPS CodeSystem

- action: parse
  name: parse-fhir-resources
  status: "Checking if all FHIR Resource files can be parsed"
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"
    - "!fhirpkg.lock.json"

- name: resource-validation
  status: "Validating resources against the FHIR standard and their profiles"
  action: validate
  category: Resource
  suppress:
    - 6005
    - eld-16

- name: version-filled
  filter: (StructureDefinition or ValueSet or CodeSystem or ConceptMap or StructureMap or NamingSystem or SearchParameter or CapabilityStatement or OperationDefinition or ImplementationGuide).exists()
  # Excluding NamingSystem as they have no version
  status: "Checking if all resources have version filled"
  # MUSS mit sushi-config.yaml:version und rulesets/version.fsh uebereinstimmen.
  # Stand 2026-09-03: 2027.0.0-ballot.rc1. Die Liste stand bis dahin auf
  # 2026.0.0 und meldete deshalb jede Ressource als fehlerhaft versioniert.
  predicate: version.exists() and (version in ('2027.0.0-ballot.rc1'))
  error-message: "version not filled (correctly)"
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"

- action: Check for valid ids
  # See https://github.com/FirelyTeam/firely-net-sdk/issues/1773
  predicate: id.matches('^[A-Za-z0-9\\-\\.]{1,64}$')
  error: The resource must have a valid id

- name: naming-convention-id
  status: "Checking if all resource ids follow the naming convention"
  predicate: id.matches('^mii-(pr|ex|lm|vs|cs|cm|sm|ns|sp|cps|od|ig|exa)-seltene')
  error-message: "resource id naming convention mismatch"
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"
    # Kein Modulartefakt: Build-Parameter des IG Publishers, referenziert
    # ueber path-expansion-params in sushi-config.yaml.
    - "!input/resources/Parameters-expansion-manifest.json"
    # Testfixtures pruefen den Validator, nicht die Namenskonvention.
    - "!tests/**"

- name: naming-convention-name
  filter: (StructureDefinition or ValueSet or CodeSystem or ConceptMap or StructureMap or NamingSystem or SearchParameter or CapabilityStatement or OperationDefinition or ImplementationGuide).exists()
  status: "Checking if all resource names follow the naming convention"
  # Modulsegment gemischt geschrieben, wie in allen MII-Modulen
  # (MII_CS_Meta_DIZ_Standorte). Stand bis 2026-09-03 auf _SELTENE und
  # schlug dadurch bei jeder Ressource an, auch den konventionskonformen.
  predicate: name.exists() implies name.matches('^MII_(PR|EX|LM|VS|CS|CM|SM|NS|SP|CPS|OD|IG|EXA)_Seltene')
  error-message: "resource name naming convention mismatch"
  files:
    - /**/*.xml
    - /**/*.json
    - "!package.json"
